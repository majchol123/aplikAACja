name: Deploy

# Push to main → CI (reusable workflow) → staging → manual approval → production.
# No workflow_run/pull_request_target: code from forks never runs with deploy secrets.
# Cloudflare credentials are environment secrets (staging/production, branch policy: main)
# and are exposed only to the wrangler steps — not to dependency install or the build.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    # Job-level call, resolved by GitHub before any step runs (no workspace state involved).
    # Switch to `$/` once actionlint supports the self-repository syntax.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  staging:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://relaacja-staging.jagiellona.one.pl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: D1 migrations
        working-directory: app
        run: pnpm exec wrangler d1 migrations apply DB --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build
        working-directory: app
        run: pnpm build
        env:
          CLOUDFLARE_ENV: staging
      - name: Deploy
        working-directory: app
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: app/scripts/smoke.sh https://relaacja-staging.jagiellona.one.pl

  production:
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Required reviewer configured on the GitHub environment.
    environment:
      name: production
      url: https://relaacja.jagiellona.one.pl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: D1 migrations
        working-directory: app
        run: pnpm exec wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build
        working-directory: app
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Deploy
        working-directory: app
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: app/scripts/smoke.sh https://relaacja.jagiellona.one.pl
