name: ZAP baseline

# Passive OWASP ZAP scan of the public pages of staging (PLAN §7, F7): headers, cookies,
# CSP, information leaks. It only crawls what an anonymous visitor sees; the API answers 401.
# Accepted alerts are listed with a reason in .zap/rules.tsv; anything else fails the run.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://staging.aplikaacja.one.pl/
          rules_file_name: .zap/rules.tsv
          # -a: alpha passive rules too; -I would ignore warnings, which is what rules.tsv is for.
          cmd_options: -a
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline
