version: 2
# Cooldown: new releases wait a week before a PR (time for a compromised release to be pulled).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['wrangler', '@cloudflare/*']
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node.js type definitions follow the runtime major version (.nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
