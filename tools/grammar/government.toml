# What a verb's objects take (rekcja, PLAN §2.10 G2, level "Pełna"): "lubię piłkę", "chcę
# wody", "daję mamie piłkę". Verbs without an entry leave their nouns as on the tile — a wrong
# case changes what the user says, so the table only holds what is sure. The builder puts it
# into grammar.<hash8>.json (`government`), checking every verb against PoliMorf.
#
# A frame is a list of slots, filled by the clause's nouns that are neither its subject nor
# after a preposition, in their order:
#   acc, gen, dat, inst   — the case of the slot;
#   dat+                  — only someone (a person, an animal) fills it, "dać mamie";
#   inst-                 — only a thing fills it, "jechać autobusem" (but not "jechać mamą");
#   na:acc, o:loc, …      — the case after that preposition with this verb ("czekać na mamę");
#   thing                 — a thing before the verb may be its subject ("deszcz pada").
# "nie" before the verb turns acc into gen ("nie mam czasu"). Reflexive verbs are written with
# "się" ("bać się"). Prepositions without an entry take their usual case (inflect.ts).

