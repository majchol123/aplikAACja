# Which form the app says when PoliMorf lists several for one lemma and tag
# (aplikaacja_tools/grammar.py).
#
# PoliMorf merges homographs under one lemma ("boleć": boli 'hurts' and boleje 'grieves';
# "dostać": dostanę 'get' and dostoję 'stand out') and keeps archaic or regional variants
# ("otwarł" next to "otworzył"). For each tag with several forms, those matching the lemma's
# pattern (a Python regex over the whole form) come first and the first is said; the others stay
# behind them, so another sense of a homograph remains reachable ("paść się" is said with "pasę",
# see SENSES in packages/shared/src/inflect.ts). A traditional form wins over a newer or
# colloquial variant (the correct form, never the colloquial one); where both
# are standard, the more common one does.
#
# `uv run build_lexicon.py --set-dir … --report` lists the vocabulary lemmas still ambiguous.

[prefer]
"bazgrać" = "bazgra.*"
"boleć" = "bol(?!ej).*|ból.*"
"ciec" = "ciekn.*"
"cuchnąć" = "cuchn.*"
"deptać" = "depcz.*"
"dojrzeć" = "dojrzej.*"
"dokonywać" = "dokonuj.*"
"dostać" = "dostan.*|dostań.*"
"dygotać" = "dygocz.*"
"dziać" = "dzia.*"
"gdakać" = "gdacz.*"
"gilgotać" = "gilgocz.*"
