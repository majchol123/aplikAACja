[project]
name = "relaacja-tools"
version = "0.1.0"
description = "Offline builders for relAACja symbol sets: ARASAAC mirror, search index, inflection lexicon"
requires-python = ">=3.13"
dependencies = ["pillow>=12"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
